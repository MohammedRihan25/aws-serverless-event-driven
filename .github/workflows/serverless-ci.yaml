name: Serverless CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ========================================================
  # Job 1: Test Serverless Functions
  # ========================================================
  test-lambdas:
    name: Run Lambda Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

      - name: Run Security Audit with Bandit
        run: |
          bandit -r src/ -ll -ii

  # ========================================================
  # Job 2: Terraform Validation
  # ========================================================
  validate-terraform:
    name: Validate Serverless Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Check Formatting
        run: terraform fmt -diff terraform/

      - name: Initialize (No Backend)
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Syntax
        run: terraform -chdir=terraform validate
